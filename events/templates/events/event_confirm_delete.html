
{% extends 'dashboard/base.html' %}

{% block content %}

<div style="padding:30px;">

    <div class="card"
         style="
         background:white;
         max-width:600px;
         margin:auto;
         padding:30px;
         border-radius:10px;
         text-align:center;
         ">

        <i class="fas fa-exclamation-triangle"
           style="font-size:50px;color:#e53935;">
        </i>

        <h3 style="margin-top:20px;">
            Eliminar Evento?
        </h3>

        <p>
            Tem a certeza de que deseja eliminar
            <strong>{{ event.title }}</strong>?
        </p>

        <p style="color:#777;">
            Esta ação não pode ser desfeita.
        </p>


        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger"
            >
                Sim, Eliminar
            </button>


            <a
                href="{% url 'events:event_list' %}"
                class="btn btn-secondary"
            >
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
